<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Voicy — OBS / vMix Broadcast Overlay</title>
  
  <!-- Firebase Compat SDKs para Realtime Database -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: transparent !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 48px;
    }

    /* Contenedor Lower-Third de Subtítulos para OBS/vMix */
    .caption-overlay-box {
      max-width: 85%;
      min-width: 480px;
      background: rgba(9, 11, 16, 0.82);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-left: 4px solid #7B4FFF;
      border-radius: 16px;
      padding: 16px 28px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7);
      transition: opacity 0.3s ease, transform 0.3s ease;
      opacity: 0;
      transform: translateY(12px);
    }

    .caption-overlay-box.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .caption-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.6);
    }

    .caption-text {
      font-size: 28px;
      line-height: 1.35;
      font-weight: 700;
      color: #FFFFFF;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8), 0 0 2px rgba(0,0,0,0.9);
      letter-spacing: -0.2px;
      word-break: break-word;
      max-height: 2.85em; /* Límite estricto de 2 líneas */
      overflow: hidden;
    }
  </style>
</head>
<body>

  <div class="caption-overlay-box" id="overlayBox">
    <div class="caption-header">
      <span id="lblStageTitle">STAGE 1</span>
      <span id="lblLangMode" style="color:#A78BFA;">ESPAÑOL</span>
    </div>
    <div class="caption-text" id="captionText">...</div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let sessionId = urlParams.get('session') || urlParams.get('s') || 'stage-1';
    let lang = urlParams.get('lang') || 'es'; // 'es' | 'en' | 'pt' | 'original'

    if (sessionId === 'main-stage') sessionId = 'stage-1';
    if (sessionId === 'ai-stage') sessionId = 'stage-2';

    const overlayBox = document.getElementById('overlayBox');
    const lblStageTitle = document.getElementById('lblStageTitle');
    const lblLangMode = document.getElementById('lblLangMode');
    const captionText = document.getElementById('captionText');

    lblStageTitle.innerText = sessionId.replace('-', ' ').toUpperCase();
    lblLangMode.innerText = lang.toUpperCase();

    let hideTimeout = null;

    function displayCaption(text) {
      if (!text || !text.trim()) {
        return;
      }

      const words = text.trim().split(/\s+/).filter(Boolean);
      // Mantener como máximo 12 palabras para asegurar 2 líneas visibles
      const visible = words.length > 12 ? words.slice(-12).join(' ') : words.join(' ');
      captionText.innerText = visible;

      overlayBox.classList.add('visible');

      if (hideTimeout) clearTimeout(hideTimeout);
      hideTimeout = setTimeout(() => {
        overlayBox.classList.remove('visible');
      }, 7000); // Ocultar automáticamente tras 7s de silencio
    }

    const firebaseConfig = {
      apiKey: "AIzaSyBI6soKQDeMSxWwQxLjjBwVQPm34ulet4E",
      appId: "1:774183311627:web:3bf35ac8094622b68d6a0e",
      databaseURL: "https://voicy-3fca6-default-rtdb.firebaseio.com",
      projectId: "voicy-3fca6"
    };

    let rtdbConnected = false;

    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      const db = firebase.database();
      
      db.ref(`liveSessions/${sessionId}`).on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          rtdbConnected = true;
          
          if (lang === 'original') {
            if (data.lastFinal?.text) displayCaption(data.lastFinal.text, false);
            else if (data.current?.partialText) displayCaption(data.current.partialText, true);
          } else if (lang === 'es') {
            const txt = data.translations?.es?.text || data.activeTranslation?.es;
            if (txt) displayCaption(txt, false);
            else if (data.current?.partialText) displayCaption(data.current.partialText, true);
          } else if (lang === 'en') {
            const txt = data.translations?.en?.text || data.activeTranslation?.en;
            if (txt) displayCaption(txt, false);
            else if (data.current?.partialText) displayCaption(data.current.partialText, true);
          } else if (lang === 'pt') {
            const txt = data.translations?.pt?.text || data.activeTranslation?.pt;
            if (txt) displayCaption(txt, false);
            else if (data.current?.partialText) displayCaption(data.current.partialText, true);
          }
        }
      });
    } catch (e) {
      console.warn("RTDB offline:", e);
    }
  </script>
</body>
</html>
