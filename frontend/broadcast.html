<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>Voicy — Speaker Studio</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .record-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 20px 0 24px 0;
      flex-wrap: wrap;
    }

    .btn-record {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 26px;
      border-radius: 9999px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      border: none;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      background: #EF4444;
      color: #fff;
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.35);
    }

    .btn-record:hover {
      background: #DC2626;
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(239, 68, 68, 0.45);
    }

    .btn-record.recording {
      background: #1E293B;
      color: #F87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.25);
      animation: pulse-ring 2s infinite;
    }

    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      70% { box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .source-select-minimal {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 10px 18px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .source-select-minimal:hover {
      border-color: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .status-dot-mini {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #EF4444;
    }
  </style>
</head>
<body style="background: #090B10; overflow-x: hidden;">

  <div class="audience-wrapper">
    <!-- Topbar Minimalista -->
    <div style="display:flex; justify-content:space-between; align-items:center; padding-bottom: 16px;">
      <a href="/" class="brand-logo" style="font-size:18px;">
        <div class="brand-logo-icon" style="width:26px; height:26px; font-size:13px;">🎙️</div>
        <span>Voicy</span>
      </a>

      <!-- Selector de Idioma: ORIGINAL vs TRADUCCIÓN -->
      <div style="display:flex; background:rgba(255,255,255,0.06); padding:3px; border-radius:12px; border:1px solid var(--border);">
        <button id="btnLangOriginal" class="btn btn-sm" style="padding:6px 14px; font-size:11px; border-radius:9px; background:var(--brand-purple); color:#fff;" onclick="setLanguage('original')">
          ORIGINAL
        </button>
        <button id="btnLangTranslate" class="btn btn-sm" style="padding:6px 14px; font-size:11px; border-radius:9px; background:transparent; color:var(--text-muted);" onclick="setLanguage('translated')">
          <span id="lblTargetLang">TRADUCCIÓN</span>
        </button>
      </div>
    </div>

    <!-- Título de la Sala -->
    <div style="margin-top:8px;">
      <div style="font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.8px;">
        Sala de Transmisión
      </div>
      <h2 id="sessionTitle" style="font-family:var(--font-h); font-size:22px; font-weight:700; margin-top:2px;">
        MAIN STAGE
      </h2>
    </div>

    <!-- Barra de Control: Botón de Record Minimalista y Selector de Fuente -->
    <div class="record-bar">
      <button id="btnRecordToggle" class="btn-record" onclick="toggleBroadcast()">
        <span class="status-dot-mini" id="recordDot"></span>
        <span id="recordText">RECORD</span>
      </button>

      <select id="selAudioSource" class="source-select-minimal">
        <option value="mic">🎙️ Micrófono en Vivo</option>
        <option value="sample">🎵 Audio Demo (Nerdearla EN)</option>
      </select>

      <span id="statusIndicator" style="font-size:12px; color:var(--text-dim); margin-left:auto;">
        Listo para grabar
      </span>
    </div>

    <!-- Pantalla Principal de Texto en Tiempo Real -->
    <div class="audience-captions" id="captionsContainer">
      <div id="captionFinal" class="final-phrase"></div>
      <div>
        <span id="captionLive" class="live-phrase">Presioná RECORD para comenzar a hablar...</span>
        <span class="cursor-blink"></span>
      </div>
    </div>

    <!-- Footer Minimalista -->
    <div style="margin-top:auto; padding-top:20px; display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--text-dim); border-top:1px solid var(--border);">
      <span>Nerdearla Vibeathon 2026</span>
      <span>Gemini 3.5 Live & Flash</span>
    </div>
  </div>

  <script>
    // Extraer sessionId de URLSearchParams (?session=main-stage) o del path
    const urlParams = new URLSearchParams(window.location.search);
    const pathParts = window.location.pathname.split('/');
    const pathSession = pathParts[2] && pathParts[2] !== 'broadcast.html' ? pathParts[2] : null;
    const sessionId = urlParams.get('session') || urlParams.get('s') || pathSession || 'main-stage';
    
    document.getElementById('sessionTitle').innerText = sessionId.replace('-', ' ').toUpperCase();

    const captionFinal = document.getElementById('captionFinal');
    const captionLive = document.getElementById('captionLive');
    const btnLangOriginal = document.getElementById('btnLangOriginal');
    const btnLangTranslate = document.getElementById('btnLangTranslate');
    const lblTargetLang = document.getElementById('lblTargetLang');
    const btnRecordToggle = document.getElementById('btnRecordToggle');
    const recordDot = document.getElementById('recordDot');
    const recordText = document.getElementById('recordText');
    const selAudioSource = document.getElementById('selAudioSource');
    const statusIndicator = document.getElementById('statusIndicator');

    let currentMode = 'original'; // 'original' | 'translated'
    let currentTargetLang = 'es';

    // Buffers de texto
    let originalPartial = '';
    let originalFinal = '';
    let translatedFinal = '';

    // Variables de audio y WebSocket
    let audioContext = null;
    let mediaStream = null;
    let workletNode = null;
    let ws = null;
    let isBroadcasting = false;
    let sampleSourceNode = null;

    function setLanguage(mode) {
      currentMode = mode;
      if (mode === 'original') {
        btnLangOriginal.style.background = 'var(--brand-purple)';
        btnLangOriginal.style.color = '#fff';
        btnLangTranslate.style.background = 'transparent';
        btnLangTranslate.style.color = 'var(--text-muted)';
      } else {
        btnLangTranslate.style.background = 'var(--brand-purple)';
        btnLangTranslate.style.color = '#fff';
        btnLangOriginal.style.background = 'transparent';
        btnLangOriginal.style.color = 'var(--text-muted)';
      }
      renderCaptions();
    }

    let renderTimer = null;
    function renderCaptions() {
      if (!renderTimer) {
        renderTimer = setTimeout(() => {
          if (currentMode === 'original') {
            captionFinal.innerText = originalFinal;
            captionLive.innerText = originalPartial || (originalFinal ? '' : (isBroadcasting ? 'Escuchando al orador...' : 'Presioná RECORD para comenzar a hablar...'));
          } else {
            captionFinal.innerText = translatedFinal;
            captionLive.innerText = originalPartial ? '[Traduciendo...]' : (translatedFinal ? '' : (isBroadcasting ? 'Esperando traducción...' : 'Presioná RECORD para comenzar a hablar...'));
          }
          renderTimer = null;
        }, 60);
      }
    }

    function getWsUrl() {
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        return `ws://localhost:8090/ws/broadcast/${sessionId}`;
      }
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      return `${protocol}//${window.location.host}/ws/broadcast/${sessionId}`;
    }

    async function toggleBroadcast() {
      if (isBroadcasting) {
        stopBroadcast();
      } else {
        await startBroadcast();
      }
    }

    async function startBroadcast() {
      try {
        btnRecordToggle.disabled = true;
        recordText.innerText = 'CONECTANDO...';
        statusIndicator.innerText = 'Conectando con Gemini...';

        const wsUrl = getWsUrl();
        ws = new WebSocket(wsUrl);
        ws.binaryType = 'arraybuffer';

        ws.onopen = async () => {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          await audioContext.audioWorklet.addModule('/worklets/pcm-processor.js');

          let sourceNode = null;

          if (selAudioSource.value === 'sample') {
            const audioElem = new Audio('/samples/nerdearla-sample.wav');
            audioElem.loop = true;
            await audioElem.play().catch(() => console.log('Autoplay sample'));
            sourceNode = audioContext.createMediaElementSource(audioElem);
            sampleSourceNode = audioElem;
          } else {
            mediaStream = await navigator.mediaDevices.getUserMedia({
              audio: {
                channelCount: 1,
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true
              }
            });
            sourceNode = audioContext.createMediaStreamSource(mediaStream);
          }

          workletNode = new AudioWorkletNode(audioContext, 'streaming-pcm-resampler');

          workletNode.port.onmessage = (event) => {
            if (isBroadcasting && ws && ws.readyState === WebSocket.OPEN) {
              ws.send(event.data.buffer);
            }
          };

          sourceNode.connect(workletNode);

          isBroadcasting = true;
          btnRecordToggle.disabled = false;
          btnRecordToggle.classList.add('recording');
          recordDot.style.background = '#F87171';
          recordText.innerText = 'DETENER';
          selAudioSource.disabled = true;
          statusIndicator.innerText = '• Grabando y transmitiendo en vivo';
          renderCaptions();
        };

        ws.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            if (msg.type === 'interim') {
              originalPartial = msg.data.partialText || '';
              renderCaptions();
            } else if (msg.type === 'final') {
              originalFinal = msg.data.segment.text || '';
              originalPartial = '';
              renderCaptions();
            } else if (msg.type === 'translation') {
              translatedFinal = msg.data.text || '';
              currentTargetLang = msg.data.targetLang || 'es';
              lblTargetLang.innerText = currentTargetLang === 'es' ? 'ESPAÑOL' : 'ENGLISH';
              renderCaptions();
            } else if (msg.type === 'gemini_status') {
              if (msg.status === 'connected') {
                statusIndicator.innerText = '• En vivo (Gemini Transcribe Activo)';
              }
            }
          } catch (e) {
            console.warn('Mensaje recibido:', event.data);
          }
        };

        ws.onclose = () => {
          stopBroadcast();
        };

        ws.onerror = (err) => {
          console.error('Error WebSocket:', err);
          statusIndicator.innerText = 'Error de conexión';
          stopBroadcast();
        };

      } catch (err) {
        console.error('Error al iniciar transmisión:', err);
        alert(`Error al iniciar micrófono: ${err.message}`);
        stopBroadcast();
      }
    }

    function stopBroadcast() {
      isBroadcasting = false;
      if (ws) {
        try { ws.close(); } catch (e) {}
        ws = null;
      }
      if (sampleSourceNode) {
        sampleSourceNode.pause();
        sampleSourceNode = null;
      }
      if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
        mediaStream = null;
      }
      if (audioContext) {
        try { audioContext.close(); } catch (e) {}
        audioContext = null;
      }

      btnRecordToggle.disabled = false;
      btnRecordToggle.classList.remove('recording');
      recordDot.style.background = '#fff';
      recordText.innerText = 'RECORD';
      selAudioSource.disabled = false;
      statusIndicator.innerText = 'Transmisión detenida';
      renderCaptions();
    }
  </script>
</body>
</html>
