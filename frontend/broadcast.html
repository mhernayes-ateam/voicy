<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>Voicy — Speaker Studio</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .record-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 18px 0 22px 0;
      flex-wrap: wrap;
    }

    .btn-record {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 13px 26px;
      border-radius: 9999px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      border: none;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      background: #EF4444;
      color: #fff;
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.35);
    }

    .btn-record:hover {
      background: #DC2626;
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(239, 68, 68, 0.45);
    }

    .btn-record.recording {
      background: #1E293B;
      color: #F87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.25);
      animation: pulse-ring 2s infinite;
    }

    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      70% { box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .source-select-minimal {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 9px 16px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .source-select-minimal:hover {
      border-color: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .stage-tab {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .stage-tab:hover, .stage-tab.active {
      border-color: var(--brand-purple);
      color: #fff;
      background: rgba(123, 79, 255, 0.18);
    }

    .lang-pill {
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 9px;
      border: none;
      cursor: pointer;
      background: transparent;
      color: var(--text-muted);
      transition: all 0.15s ease;
    }
    .lang-pill.active {
      background: var(--brand-purple);
      color: #fff;
    }

    .status-dot-mini {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #EF4444;
    }

    /* Modal de Código QR */
    .qr-modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .qr-modal-content {
      background: #11141D;
      border: 1px solid rgba(123, 79, 255, 0.35);
      border-radius: 24px;
      padding: 32px 28px;
      text-align: center;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      animation: popIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .qr-img {
      width: 230px;
      height: 230px;
      margin: 18px auto;
      border-radius: 16px;
      background: #fff;
      padding: 10px;
    }
  </style>
</head>
<body style="background: #090B10; overflow-x: hidden;">

  <div class="audience-wrapper">
    <!-- Topbar Minimalista -->
    <div style="display:flex; justify-content:space-between; align-items:center; padding-bottom: 14px;">
      <a href="/" class="brand-logo" style="font-size:18px;">
        <div class="brand-logo-icon" style="width:26px; height:26px; font-size:13px;">🎙️</div>
        <span>Voicy</span>
      </a>

      <!-- Selector de Idioma Cuádruple: ORIGINAL | ESPAÑOL | ENGLISH | PORTUGUÊS -->
      <div style="display:flex; background:rgba(255,255,255,0.06); padding:3px; border-radius:12px; border:1px solid var(--border); overflow-x:auto;">
        <button id="btnLangOriginal" class="lang-pill active" onclick="setLanguage('original')">ORIGINAL</button>
        <button id="btnLangEs" class="lang-pill" onclick="setLanguage('es')">ESPAÑOL</button>
        <button id="btnLangEn" class="lang-pill" onclick="setLanguage('en')">ENGLISH</button>
        <button id="btnLangPt" class="lang-pill" onclick="setLanguage('pt')">PORTUGUÊS</button>
      </div>
    </div>

    <!-- Título y Selector de Stage (Stage 1 / 2 / 3) -->
    <div style="margin-top:6px; display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:12px;">
      <div>
        <div style="font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.8px;">
          Sala de Transmisión
        </div>
        <h2 id="sessionTitle" style="font-family:var(--font-h); font-size:24px; font-weight:700; margin-top:2px;">
          STAGE 1
        </h2>
      </div>

      <!-- Selector de Escenario (Requisito Multi-Stage Nerdearla) -->
      <div style="display:flex; gap:8px;">
        <button id="tabStage1" class="stage-tab active" onclick="selectStage('stage-1')">Stage 1</button>
        <button id="tabStage2" class="stage-tab" onclick="selectStage('stage-2')">Stage 2</button>
        <button id="tabStage3" class="stage-tab" onclick="selectStage('stage-3')">Stage 3</button>
      </div>
    </div>

    <!-- Barra de Control: Botón de Record, Fuente y Botón de QR -->
    <div class="record-bar">
      <button id="btnRecordToggle" class="btn-record" onclick="toggleBroadcast()">
        <span class="status-dot-mini" id="recordDot"></span>
        <span id="recordText">RECORD</span>
      </button>



      <!-- Botón para Mostrar el QR de Audiencia en Pantalla -->
      <button class="stage-tab" style="display:inline-flex; align-items:center; gap:6px; margin-left:auto;" onclick="openQrModal()">
        <span>📱 QR Audiencia</span>
      </button>
    </div>

    <div style="font-size:12px; color:var(--text-dim); margin-bottom:12px;">
      <span id="statusIndicator">Listo para transmitir</span>
    </div>

    <!-- Pantalla Principal de Subtítulos: 2 Líneas Dinámicas Roll-Up (Estándar Dorado) -->
    <div class="audience-captions" id="captionsContainer">
      <div class="caption-rollup-viewport">
        <div id="captionTop" class="caption-line caption-line-top"></div>
        <div id="captionBottom" class="caption-line caption-line-bottom">
          <span id="captionLive" class="live-phrase">Presioná RECORD para comenzar...</span>
          <span class="cursor-blink"></span>
        </div>
      </div>
    </div>

    <!-- Footer con enlaces a todos los módulos -->
    <div style="margin-top:auto; padding-top:20px; display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--text-dim); border-top:1px solid var(--border); flex-wrap:wrap; gap:10px;">
      <span style="font-weight:600; color:var(--text-muted);">Nerdearla 2026</span>
      <div style="display:flex; gap:14px; flex-wrap:wrap; align-items:center;">
        <a href="/" target="_blank" style="color:#A78BFA; text-decoration:none; font-weight:600;">👥 Vista Audiencia</a>
        <a href="/overlay?session=stage-1&lang=es" target="_blank" style="color:var(--brand-cyan); text-decoration:none; font-weight:600;">📺 Overlay OBS</a>
        <a href="/monitor" target="_blank" style="color:#34D399; text-decoration:none; font-weight:600;">🎛️ Producción</a>
      </div>
    </div>
  </div>

  <!-- Modal Emergente de Código QR para Proyectar o Compartir -->
  <div class="qr-modal-backdrop" id="qrModal" onclick="closeQrModal(event)">
    <div class="qr-modal-content">
      <div style="font-size:12px; font-weight:700; color:#A78BFA; text-transform:uppercase; letter-spacing:0.8px;">
        Subtítulos para la Audiencia
      </div>
      <h3 style="font-size:20px; font-weight:700; margin-top:4px;" id="qrStageTitle">Stage 1</h3>
      <p style="font-size:13px; color:var(--text-muted); margin-top:4px;">
        Escaneá con tu celular para leer los subtítulos en tiempo real:
      </p>

      <img id="qrImage" class="qr-img" src="" alt="QR Subtítulos Audiencia">

      <div style="font-size:12px; color:var(--brand-cyan); word-break:break-all; font-family:monospace;" id="qrUrlLabel">
        ...
      </div>

      <button class="btn btn-outline btn-sm" style="margin-top:20px; width:100%; border-radius:12px;" onclick="closeQrModal()">
        Cerrar
      </button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let sessionId = urlParams.get('session') || urlParams.get('s') || 'stage-1';
    
    // Normalizar main-stage a stage-1
    if (sessionId === 'main-stage') sessionId = 'stage-1';
    if (sessionId === 'ai-stage') sessionId = 'stage-2';

    const sessionTitle = document.getElementById('sessionTitle');
    const tabStage1 = document.getElementById('tabStage1');
    const tabStage2 = document.getElementById('tabStage2');
    const tabStage3 = document.getElementById('tabStage3');
    const captionTop = document.getElementById('captionTop');
    const captionLive = document.getElementById('captionLive');
    const btnRecordToggle = document.getElementById('btnRecordToggle');
    const recordDot = document.getElementById('recordDot');
    const recordText = document.getElementById('recordText');
    const selAudioSource = document.getElementById('selAudioSource');
    const statusIndicator = document.getElementById('statusIndicator');

    const btnLangOriginal = document.getElementById('btnLangOriginal');
    const btnLangEs = document.getElementById('btnLangEs');
    const btnLangEn = document.getElementById('btnLangEn');
    const btnLangPt = document.getElementById('btnLangPt');

    let currentMode = 'original'; // 'original' | 'es' | 'en' | 'pt'

    // Buffers de texto
    let originalPartial = '';
    let originalFinal = '';
    let spanishFinal = '';
    let englishFinal = '';
    let portugueseFinal = '';

    // Variables de audio y WebSocket
    let audioContext = null;
    let mediaStream = null;
    let workletNode = null;
    let ws = null;
    let isBroadcasting = false;
    let sampleSourceNode = null;

    function updateStageTabs() {
      sessionTitle.innerText = sessionId.replace('-', ' ').toUpperCase();
      [tabStage1, tabStage2, tabStage3].forEach(t => t.classList.remove('active'));
      if (sessionId === 'stage-2') tabStage2.classList.add('active');
      else if (sessionId === 'stage-3') tabStage3.classList.add('active');
      else tabStage1.classList.add('active');
    }
    updateStageTabs();

    function selectStage(newSession) {
      if (isBroadcasting) {
        alert("Detené la grabación antes de cambiar de escenario.");
        return;
      }
      sessionId = newSession;
      window.history.replaceState(null, '', `?session=${sessionId}`);
      updateStageTabs();
      // Limpiar buffers
      originalPartial = '';
      originalFinal = '';
      spanishFinal = '';
      englishFinal = '';
      portugueseFinal = '';
      streamerLive.committedLine = '';
      renderCaptions();
    }

    function setLanguage(mode) {
      currentMode = mode;
      btnLangOriginal.classList.toggle('active', mode === 'original');
      btnLangEs.classList.toggle('active', mode === 'es');
      btnLangEn.classList.toggle('active', mode === 'en');
      btnLangPt.classList.toggle('active', mode === 'pt');
      renderCaptions();
    }

    class GoldenRollUpStreamer {
      constructor(topEl, bottomEl, placeholder = 'Presioná RECORD para comenzar...') {
        this.topEl = topEl;
        this.bottomEl = bottomEl;
        this.placeholder = placeholder;
        this.previousCommitted = '';
        this.maxWordsPerLine = 8;
        this.lastRawText = '';
      }

      setCommittedLine(text) {
        if (!text || !text.trim()) return;
        const words = text.trim().split(/\s+/).filter(Boolean);
        if (words.length > 0) {
          this.previousCommitted = words.slice(-this.maxWordsPerLine).join(' ');
        }
      }

      renderDirect(topText, bottomText) {
        this.topEl.innerText = topText || '';
        this.bottomEl.innerText = bottomText || (isBroadcasting ? 'Escuchando al orador...' : this.placeholder);
      }

      streamTo(fullText) {
        if (!fullText || !fullText.trim()) {
          this.topEl.innerText = '';
          this.bottomEl.innerText = isBroadcasting ? 'Escuchando al orador...' : this.placeholder;
          this.lastRawText = '';
          return;
        }

        const trimmed = fullText.trim();
        if (trimmed === this.lastRawText) return;
        this.lastRawText = trimmed;

        const words = trimmed.split(/\s+/).filter(Boolean);

        if (words.length <= this.maxWordsPerLine) {
          const currentJoined = words.join(' ');
          if (this.previousCommitted && this.previousCommitted !== currentJoined) {
            this.topEl.innerText = this.previousCommitted;
          } else {
            this.topEl.innerText = '';
          }
          this.bottomEl.innerText = currentJoined;
        } else {
          // Roll-up de 2 líneas dentro de una oración larga
          const visible = words.slice(-(this.maxWordsPerLine * 2));
          const splitIdx = Math.max(1, visible.length - this.maxWordsPerLine);
          this.topEl.innerText = visible.slice(0, splitIdx).join(' ');
          this.bottomEl.innerText = visible.slice(splitIdx).join(' ');
        }
      }
    }

    const streamerLive = new GoldenRollUpStreamer(captionTop, captionLive, 'Presioná RECORD para comenzar...');

    function renderCaptions() {
      if (currentMode === 'original') {
        const text = originalPartial || originalFinal;
        streamerLive.streamTo(text);
      } else {
        let activeTranslation = '';
        if (currentMode === 'es') activeTranslation = spanishFinal;
        else if (currentMode === 'en') activeTranslation = englishFinal;
        else if (currentMode === 'pt') activeTranslation = portugueseFinal;

        if (originalPartial) {
          // El orador está hablando: mantener traducción previa arriba y mostrar voz en vivo abajo
          streamerLive.renderDirect(activeTranslation, `« ${originalPartial} »`);
        } else if (activeTranslation) {
          streamerLive.streamTo(activeTranslation);
        } else if (originalFinal) {
          streamerLive.streamTo(originalFinal);
        } else {
          streamerLive.streamTo('');
        }
      }
    }

    let connectTimeout = null;

    function getWsUrl() {
      // 1. Si se especificó ?backend=... en la URL
      const customBackend = urlParams.get('backend');
      if (customBackend) {
        return customBackend.startsWith('ws') ? customBackend : `ws://${customBackend}/ws/broadcast/${sessionId}`;
      }

      // 2. Si estamos en localhost o 127.0.0.1
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        return `ws://localhost:8090/ws/broadcast/${sessionId}`;
      }

      // 3. Si se accede desde Firebase Hosting o IP de red:
      // Conectar a la máquina del orador donde corre el backend local de captura
      return `ws://localhost:8090/ws/broadcast/${sessionId}`;
    }

    async function toggleBroadcast() {
      if (isBroadcasting) {
        stopBroadcast();
      } else {
        await startBroadcast();
      }
    }

    async function startBroadcast() {
      try {
        btnRecordToggle.disabled = true;
        recordText.innerText = 'CONECTANDO...';
        statusIndicator.innerText = `Conectando con servidor de audio para ${sessionId.toUpperCase()}...`;

        const wsUrl = getWsUrl();

        if (connectTimeout) clearTimeout(connectTimeout);
        connectTimeout = setTimeout(() => {
          if (!isBroadcasting) {
            console.warn('Timeout conectando WebSocket');
            statusIndicator.innerText = 'Tiempo de espera agotado. Verificá que el servidor esté activo en http://localhost:8090';
            stopBroadcast();
          }
        }, 6000);

        ws = new WebSocket(wsUrl);
        ws.binaryType = 'arraybuffer';

        ws.onopen = async () => {
          if (connectTimeout) clearTimeout(connectTimeout);
          try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            if (audioContext.state === 'suspended') {
              await audioContext.resume();
            }

            await audioContext.audioWorklet.addModule('/worklets/pcm-processor.js');

            mediaStream = await navigator.mediaDevices.getUserMedia({
              audio: {
                channelCount: 1,
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true
              }
            });
            const sourceNode = audioContext.createMediaStreamSource(mediaStream);

            workletNode = new AudioWorkletNode(audioContext, 'streaming-pcm-resampler');

            workletNode.port.onmessage = (event) => {
              if (isBroadcasting && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(event.data.buffer);
              }
            };

            sourceNode.connect(workletNode);

            isBroadcasting = true;

            // Limpiar buffers de la sesión anterior para arrancar limpio
            originalPartial = '';
            originalFinal = '';
            spanishFinal = '';
            englishFinal = '';
            portugueseFinal = '';
            streamerLive.previousCommitted = '';
            streamerLive.lastRawText = '';
            streamerLive.topEl.innerText = '';
            streamerLive.bottomEl.innerText = 'Escuchando al orador...';

            btnRecordToggle.disabled = false;
            btnRecordToggle.classList.add('recording');
            recordDot.style.background = '#F87171';
            recordText.innerText = 'DETENER';

            tabStage1.disabled = true;
            tabStage2.disabled = true;
            tabStage3.disabled = true;
            statusIndicator.innerText = `• En vivo en ${sessionId.toUpperCase()} (Transmitiendo audio)`;
            renderCaptions();
          } catch (err) {
            console.error('Error al inicializar captura de audio:', err);
            alert(`Error al acceder al micrófono o audio: ${err.message}\n\nAsegurate de permitir el acceso al micrófono en el navegador.`);
            stopBroadcast();
          }
        };

        ws.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            if (msg.type === 'interim') {
              originalPartial = msg.data.partialText || '';
              renderCaptions();
            } else if (msg.type === 'final') {
              const txt = msg.data.segment.text || '';
              originalFinal = txt;
              originalPartial = '';
              // Fix 2: solo actualizar committed line si el modo activo es 'original'
              if (currentMode === 'original') streamerLive.setCommittedLine(txt);
              renderCaptions();
            } else if (msg.type === 'translation') {
              const trEs = msg.data.es || msg.data.text || '';
              const trEn = msg.data.en || msg.data.text || '';
              const trPt = msg.data.pt || msg.data.text || '';
              spanishFinal = trEs;
              englishFinal = trEn;
              portugueseFinal = trPt;
              // Fix 2: actualizar committed line solo para el idioma activo
              if (currentMode === 'es') streamerLive.setCommittedLine(trEs);
              else if (currentMode === 'en') streamerLive.setCommittedLine(trEn);
              else if (currentMode === 'pt') streamerLive.setCommittedLine(trPt);
              renderCaptions();
            } else if (msg.type === 'gemini_status') {
              if (msg.status === 'connected') {
                statusIndicator.innerText = `• En vivo en ${sessionId.toUpperCase()} (Gemini Live Conectado)`;
              }
            }
          } catch (e) {}
        };

        ws.onclose = () => {
          stopBroadcast();
        };

        ws.onerror = (err) => {
          console.error('Error WebSocket:', err);
          if (connectTimeout) clearTimeout(connectTimeout);
          statusIndicator.innerText = 'Error de conexión. Asegurate de que el backend esté corriendo en http://localhost:8090';
          stopBroadcast();
        };

      } catch (err) {
        console.error('Error al iniciar transmisión:', err);
        alert(`Error al iniciar transmisión: ${err.message}`);
        stopBroadcast();
      }
    }

    function stopBroadcast() {
      if (connectTimeout) clearTimeout(connectTimeout);
      isBroadcasting = false;
      if (ws) {
        try { ws.close(); } catch (e) {}
        ws = null;
      }

      if (mediaStream) {
        try { mediaStream.getTracks().forEach(t => t.stop()); } catch (e) {}
        mediaStream = null;
      }
      if (audioContext) {
        try { audioContext.close(); } catch (e) {}
        audioContext = null;
      }

      btnRecordToggle.disabled = false;
      btnRecordToggle.classList.remove('recording');
      recordDot.style.background = '#fff';
      recordText.innerText = 'RECORD';

      tabStage1.disabled = false;
      tabStage2.disabled = false;
      tabStage3.disabled = false;
      statusIndicator.innerText = 'Transmisión detenida';

      // Limpiar todos los buffers para que el próximo Record arranque vacío
      originalPartial = '';
      originalFinal = '';
      spanishFinal = '';
      englishFinal = '';
      portugueseFinal = '';
      streamerLive.previousCommitted = '';
      streamerLive.lastRawText = '';
      streamerLive.displayedCount = 0;
      streamerLive.targetWords = [];
      if (streamerLive.timer) { clearInterval(streamerLive.timer); streamerLive.timer = null; }

      renderCaptions();
    }

    // Funciones del Modal de QR
    function openQrModal() {
      // Usar host público si está disponible, o actual
      const baseUrl = window.location.hostname.includes('web.app') 
        ? 'https://voicy-3fca6.web.app' 
        : `${window.location.protocol}//${window.location.host}`;
      
      const audienceUrl = `${baseUrl}/?session=${sessionId}`;
      const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&margin=8&data=${encodeURIComponent(audienceUrl)}`;

      document.getElementById('qrStageTitle').innerText = sessionId.replace('-', ' ').toUpperCase();
      document.getElementById('qrImage').src = qrApiUrl;
      document.getElementById('qrUrlLabel').innerText = audienceUrl;
      document.getElementById('qrModal').style.display = 'flex';
    }

    function closeQrModal(e) {
      if (!e || e.target.id === 'qrModal' || e.target.tagName === 'BUTTON') {
        document.getElementById('qrModal').style.display = 'none';
      }
    }
  </script>
</body>
</html>
