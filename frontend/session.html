<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Voicy — Subtítulos en Vivo</title>
  <link rel="stylesheet" href="/css/style.css">
  
  <!-- Firebase Compat SDKs para Realtime Database -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body style="background: #090B10; overflow-x: hidden;">

  <div class="audience-wrapper">
    <!-- Topbar Mobile -->
    <div style="display:flex; justify-content:space-between; align-items:center; padding-bottom: 16px;">
      <a href="/" class="brand-logo" style="font-size:18px;">
        <div class="brand-logo-icon" style="width:26px; height:26px; font-size:13px;">🎙️</div>
        <span>Voicy</span>
      </a>

      <div style="display:flex; align-items:center; gap:8px;">
        <span class="badge-live"><span class="dot"></span> LIVE</span>
      </div>
    </div>

    <!-- Título de la Charla y Selector de Idioma -->
    <div style="margin-top:8px; margin-bottom: 20px;">
      <div style="display:flex; justify-content:space-between; align-items:flex-end;">
        <div>
          <div id="sessionStage" style="font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.8px;">
            Conferencia en Vivo
          </div>
          <h2 id="sessionTitle" style="font-family:var(--font-h); font-size:22px; font-weight:700; margin-top:2px;">
            Sala: test
          </h2>
        </div>

        <!-- Selector de Idioma: ORIGINAL vs TRADUCCIÓN (Bidireccional) -->
        <div style="display:flex; background:rgba(255,255,255,0.06); padding:3px; border-radius:12px; border:1px solid var(--border);">
          <button id="btnLangOriginal" class="btn btn-sm" style="padding:6px 12px; font-size:11px; border-radius:9px; background:var(--brand-purple); color:#fff;" onclick="setLanguage('original')">
            ORIGINAL
          </button>
          <button id="btnLangTranslate" class="btn btn-sm" style="padding:6px 12px; font-size:11px; border-radius:9px; background:transparent; color:var(--text-muted);" onclick="setLanguage('translated')">
            <span id="lblTargetLang">TRADUCCIÓN</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Pantalla Principal de Subtítulos -->
    <div class="audience-captions" id="captionsContainer">
      <div id="captionFinal" class="final-phrase"></div>
      <div>
        <span id="captionLive" class="live-phrase">Esperando inicio de la conferencia...</span>
        <span class="cursor-blink"></span>
      </div>
    </div>

    <!-- Footer Mobile -->
    <div style="margin-top:auto; padding-top:20px; display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--text-dim); border-top:1px solid var(--border);">
      <span>Nerdearla Vibeathon 2026</span>
      <span>Gemini 3.5 Live & Flash</span>
    </div>
  </div>

  <script>
    // Extraer sessionId de la URL (/session/{sessionId})
    const pathParts = window.location.pathname.split('/');
    const sessionId = pathParts[2] || 'test';
    document.getElementById('sessionTitle').innerText = sessionId.replace('-', ' ').toUpperCase();

    const captionFinal = document.getElementById('captionFinal');
    const captionLive = document.getElementById('captionLive');
    const btnLangOriginal = document.getElementById('btnLangOriginal');
    const btnLangTranslate = document.getElementById('btnLangTranslate');
    const lblTargetLang = document.getElementById('lblTargetLang');

    let currentMode = 'original'; // 'original' | 'translated'
    let currentTargetLang = 'es';

    // Datos en memoria
    let originalPartial = '';
    let originalFinal = '';
    let translatedFinal = '';

    function setLanguage(mode) {
      currentMode = mode;
      if (mode === 'original') {
        btnLangOriginal.style.background = 'var(--brand-purple)';
        btnLangOriginal.style.color = '#fff';
        btnLangTranslate.style.background = 'transparent';
        btnLangTranslate.style.color = 'var(--text-muted)';
      } else {
        btnLangTranslate.style.background = 'var(--brand-purple)';
        btnLangTranslate.style.color = '#fff';
        btnLangOriginal.style.background = 'transparent';
        btnLangOriginal.style.color = 'var(--text-muted)';
      }
      renderCaptions();
    }

    // Renderizado suave
    let renderTimer = null;
    function renderCaptions() {
      if (!renderTimer) {
        renderTimer = setTimeout(() => {
          if (currentMode === 'original') {
            captionFinal.innerText = originalFinal;
            captionLive.innerText = originalPartial || (originalFinal ? '' : 'Listening to speaker...');
          } else {
            // Modo Traducción (Español o Inglés según el orador)
            captionFinal.innerText = translatedFinal;
            captionLive.innerText = originalPartial ? `[Traduciendo...]` : (translatedFinal ? '' : 'Esperando traducción...');
          }
          renderTimer = null;
        }, 80);
      }
    }

    // Configuración Firebase Realtime Database
    const firebaseConfig = {
      apiKey: "AIzaSyBI6soKQDeMSxWwQxLjjBwVQPm34ulet4E",
      appId: "1:774183311627:web:3bf35ac8094622b68d6a0e",
      databaseURL: "https://voicy-3fca6-default-rtdb.firebaseio.com",
      projectId: "voicy-3fca6"
    };

    let rtdbConnected = false;

    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      const db = firebase.database();
      
      // Escuchar estado en vivo
      db.ref(`liveSessions/${sessionId}`).on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          rtdbConnected = true;
          originalPartial = data.current?.partialText || '';
          originalFinal = data.lastFinal?.text || '';
          
          if (data.activeTranslation?.text) {
            translatedFinal = data.activeTranslation.text;
            currentTargetLang = data.activeTranslation.targetLang || 'es';
            lblTargetLang.innerText = currentTargetLang === 'es' ? 'ESPAÑOL' : 'ENGLISH';
          }
          renderCaptions();
        }
      });
    } catch (e) {
      console.warn("RTDB offline o no configurado aún en cliente.");
    }

    // Fallback de desarrollo local por WebSocket
    setTimeout(() => {
      if (!rtdbConnected && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
        console.log("Activando listener local WebSocket para pruebas inmediatas...");
        const ws = new WebSocket(`ws://localhost:8090/ws/broadcast/${sessionId}`);
        ws.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            if (msg.type === 'interim') {
              originalPartial = msg.data.partialText || '';
              renderCaptions();
            } else if (msg.type === 'final') {
              originalFinal = msg.data.segment.text || '';
              originalPartial = '';
              renderCaptions();
            } else if (msg.type === 'translation') {
              translatedFinal = msg.data.text || '';
              currentTargetLang = msg.data.targetLang || 'es';
              lblTargetLang.innerText = currentTargetLang === 'es' ? 'ESPAÑOL' : 'ENGLISH';
              renderCaptions();
            }
          } catch (e) {}
        };
      }
    }, 1500);
  </script>
</body>
</html>
