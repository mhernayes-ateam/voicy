<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Voicy — Subtítulos en Vivo | Nerdearla 2026</title>
  <link rel="stylesheet" href="/css/style.css">
  
  <!-- Firebase Compat SDKs para Realtime Database -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <style>
    .stage-pill {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .stage-pill:hover, .stage-pill.active {
      border-color: var(--brand-purple);
      color: #fff;
      background: rgba(123, 79, 255, 0.18);
    }

    .lang-pill {
      padding: 6px 11px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 9px;
      border: none;
      cursor: pointer;
      background: transparent;
      color: var(--text-muted);
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .lang-pill.active {
      background: var(--brand-purple);
      color: #fff;
    }

    .btn-action-mini {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 11px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }
    .btn-action-mini:hover {
      border-color: rgba(255, 255, 255, 0.25);
      color: #fff;
    }

    /* Modal de Código QR */
    .qr-modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(8px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .qr-modal-content {
      background: #11141D;
      border: 1px solid rgba(123, 79, 255, 0.35);
      border-radius: 24px;
      padding: 30px 24px;
      text-align: center;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      animation: popIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .qr-img {
      width: 220px;
      height: 220px;
      margin: 16px auto;
      border-radius: 16px;
      background: #fff;
      padding: 10px;
    }
  </style>
</head>
<body style="background: #090B10; overflow-x: hidden;">

  <div class="audience-wrapper">
    <!-- Topbar Mobile: Co-Branding Nerdearla & Voicy -->
    <div style="display:flex; justify-content:space-between; align-items:center; padding-bottom: 12px; flex-wrap:wrap; gap:10px;">
      <a href="/" class="brand-logo" style="font-size:18px;">
        <div class="brand-logo-icon" style="width:26px; height:26px; font-size:13px;">🎙️</div>
        <span>Voicy <span style="font-size:11px; color:#A78BFA; font-weight:500;">× Nerdearla</span></span>
      </a>

      <!-- Selector de Idioma Cuádruple: ORIGINAL | ESPAÑOL | ENGLISH | PORTUGUÊS -->
      <div style="display:flex; background:rgba(255,255,255,0.06); padding:3px; border-radius:12px; border:1px solid var(--border); overflow-x:auto;">
        <button id="btnLangOriginal" class="lang-pill active" onclick="setLanguage('original')">ORIGINAL</button>
        <button id="btnLangEs" class="lang-pill" onclick="setLanguage('es')">ESPAÑOL</button>
        <button id="btnLangEn" class="lang-pill" onclick="setLanguage('en')">ENGLISH</button>
        <button id="btnLangPt" class="lang-pill" onclick="setLanguage('pt')">PORTUGUÊS</button>
      </div>
    </div>

    <!-- Título de la Charla y Selector de Escenario (Stage 1 / 2 / 3) -->
    <div style="margin-top:4px; margin-bottom: 18px;">
      <div style="display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:10px;">
        <div>
          <div style="display:flex; align-items:center; gap:8px;">
            <span class="badge-live" style="font-size:10px; padding:2px 8px;"><span class="dot"></span> LIVE</span>
            <span style="font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.8px;">
              Subtítulos en Vivo
            </span>
          </div>
          <h2 id="sessionTitle" style="font-family:var(--font-h); font-size:24px; font-weight:700; margin-top:4px;">
            STAGE 1
          </h2>
        </div>

        <!-- Selector de Escenario Rápido + Acciones -->
        <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
          <a href="/?session=stage-1" id="tabStage1" class="stage-pill active">Stage 1</a>
          <a href="/?session=stage-2" id="tabStage2" class="stage-pill">Stage 2</a>
          <a href="/?session=stage-3" id="tabStage3" class="stage-pill">Stage 3</a>
          <button class="btn-action-mini" onclick="openQrModal()">
            <span>📱 QR</span>
          </button>
          <button class="btn-action-mini" onclick="downloadTranscript('srt')" title="Descargar subtítulos SRT">
            <span>📥 SRT</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Pantalla Principal de Subtítulos (Ventana rodante de máximo 2 líneas) -->
    <div class="audience-captions" id="captionsContainer">
      <div class="caption-viewport">
        <div>
          <span id="captionLive" class="live-phrase">Esperando inicio de la conferencia...</span>
          <span class="cursor-blink"></span>
        </div>
      </div>
    </div>

    <!-- Footer Mobile -->
    <div style="margin-top:auto; padding-top:20px; display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--text-dim); border-top:1px solid var(--border);">
      <span>Nerdearla Vibeathon 2026</span>
      <div style="display:flex; gap:12px;">
        <a href="/monitor.html" target="_blank" style="color:var(--text-dim); text-decoration:none;">🎛️ Producción</a>
        <span>Gemini 3.5 Live & Flash</span>
      </div>
    </div>
  </div>

  <!-- Modal Emergente de Código QR para compartir -->
  <div class="qr-modal-backdrop" id="qrModal" onclick="closeQrModal(event)">
    <div class="qr-modal-content">
      <div style="font-size:12px; font-weight:700; color:#A78BFA; text-transform:uppercase; letter-spacing:0.8px;">
        Compartir Subtítulos
      </div>
      <h3 style="font-size:20px; font-weight:700; margin-top:4px;" id="qrStageTitle">Stage 1</h3>
      <p style="font-size:13px; color:var(--text-muted); margin-top:4px;">
        Escaneá con la cámara de tu celular para abrir esta sala en tu teléfono:
      </p>

      <img id="qrImage" class="qr-img" src="" alt="QR Subtítulos">

      <div style="font-size:12px; color:var(--brand-cyan); word-break:break-all; font-family:monospace;" id="qrUrlLabel">
        ...
      </div>

      <button class="btn btn-outline btn-sm" style="margin-top:18px; width:100%; border-radius:12px;" onclick="closeQrModal()">
        Cerrar
      </button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let sessionId = urlParams.get('session') || urlParams.get('s') || 'stage-1';
    
    // Normalizar nombres de etapa
    if (sessionId === 'main-stage') sessionId = 'stage-1';
    if (sessionId === 'ai-stage') sessionId = 'stage-2';

    document.getElementById('sessionTitle').innerText = sessionId.replace('-', ' ').toUpperCase();

    // Actualizar tabs de escenario
    const tabStage1 = document.getElementById('tabStage1');
    const tabStage2 = document.getElementById('tabStage2');
    const tabStage3 = document.getElementById('tabStage3');
    [tabStage1, tabStage2, tabStage3].forEach(t => t.classList.remove('active'));
    if (sessionId === 'stage-2') tabStage2.classList.add('active');
    else if (sessionId === 'stage-3') tabStage3.classList.add('active');
    else tabStage1.classList.add('active');

    const captionLive = document.getElementById('captionLive');
    const btnLangOriginal = document.getElementById('btnLangOriginal');
    const btnLangEs = document.getElementById('btnLangEs');
    const btnLangEn = document.getElementById('btnLangEn');
    const btnLangPt = document.getElementById('btnLangPt');

    let currentMode = 'original'; // 'original' | 'es' | 'en' | 'pt'

    // Datos en memoria
    let originalPartial = '';
    let originalFinal = '';
    let spanishFinal = '';
    let englishFinal = '';
    let portugueseFinal = '';

    // Historial acumulado para exportar a SRT
    const sessionHistory = [];

    function setLanguage(mode) {
      currentMode = mode;
      btnLangOriginal.classList.toggle('active', mode === 'original');
      btnLangEs.classList.toggle('active', mode === 'es');
      btnLangEn.classList.toggle('active', mode === 'en');
      btnLangPt.classList.toggle('active', mode === 'pt');
      renderCaptions();
    }

    class WordStreamer {
      constructor(element, maxVisibleWords = 11) {
        this.element = element;
        this.maxVisibleWords = maxVisibleWords;
        this.displayed = [];
        this.target = [];
        this.timer = null;
        this.lastFullText = '';
      }

      streamTo(fullText) {
        if (!fullText || !fullText.trim()) {
          this.element.innerText = '';
          this.displayed = [];
          this.target = [];
          this.lastFullText = '';
          return;
        }

        const trimmed = fullText.trim();
        if (trimmed === this.lastFullText) return;
        this.lastFullText = trimmed;

        const words = trimmed.split(/\s+/).filter(Boolean);
        this.target = words;

        // Si es una frase completamente diferente, reiniciar buffer
        const currentJoined = this.displayed.join(' ');
        if (this.displayed.length > 0 && !trimmed.startsWith(currentJoined.slice(0, 15))) {
          this.displayed = [];
        }

        if (this.timer) {
          clearInterval(this.timer);
          this.timer = null;
        }

        this.timer = setInterval(() => {
          if (this.displayed.length < this.target.length) {
            const nextWord = this.target[this.displayed.length];
            this.displayed.push(nextWord);

            // Mantener como MÁXIMO 2 LÍNEAS (descartar palabras antiguas del inicio)
            const visibleWords = this.displayed.length > this.maxVisibleWords
              ? this.displayed.slice(-this.maxVisibleWords)
              : this.displayed;

            this.element.innerText = visibleWords.join(' ');
          } else {
            clearInterval(this.timer);
            this.timer = null;

            const visibleWords = this.displayed.length > this.maxVisibleWords
              ? this.displayed.slice(-this.maxVisibleWords)
              : this.displayed;
            this.element.innerText = visibleWords.join(' ');
          }
        }, 45); // 45ms por palabra: ultra suave y natural
      }
    }

    const streamerAudience = new WordStreamer(captionLive, 11);

    function renderCaptions() {
      let activeText = '';
      if (currentMode === 'original') {
        // En original: priorizar texto en vivo mientras se habla
        activeText = originalPartial || originalFinal;
      } else if (currentMode === 'es') {
        activeText = spanishFinal || originalPartial || originalFinal;
      } else if (currentMode === 'en') {
        activeText = englishFinal || originalPartial || originalFinal;
      } else if (currentMode === 'pt') {
        activeText = portugueseFinal || originalPartial || originalFinal;
      }

      if (activeText) {
        streamerAudience.streamTo(activeText);
      } else {
        streamerAudience.streamTo('Esperando inicio de la conferencia...');
      }
    }

    // Configuración Firebase Realtime Database
    const firebaseConfig = {
      apiKey: "AIzaSyBI6soKQDeMSxWwQxLjjBwVQPm34ulet4E",
      appId: "1:774183311627:web:3bf35ac8094622b68d6a0e",
      databaseURL: "https://voicy-3fca6-default-rtdb.firebaseio.com",
      projectId: "voicy-3fca6"
    };

    let rtdbConnected = false;

    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      const db = firebase.database();
      
      // Escuchar estado en vivo de la sesión seleccionada
      db.ref(`liveSessions/${sessionId}`).on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          rtdbConnected = true;
          originalPartial = data.current?.partialText || '';
          
          if (data.lastFinal?.text && data.lastFinal.text !== originalFinal) {
            originalFinal = data.lastFinal.text;
            sessionHistory.push({
              time: new Date(),
              original: originalFinal,
              es: data.translations?.es?.text || data.activeTranslation?.es || originalFinal,
              en: data.translations?.en?.text || data.activeTranslation?.en || originalFinal,
              pt: data.translations?.pt?.text || data.activeTranslation?.pt || originalFinal
            });
          }

          if (data.translations?.es?.text) spanishFinal = data.translations.es.text;
          else if (data.activeTranslation?.es) spanishFinal = data.activeTranslation.es;

          if (data.translations?.en?.text) englishFinal = data.translations.en.text;
          else if (data.activeTranslation?.en) englishFinal = data.activeTranslation.en;

          if (data.translations?.pt?.text) portugueseFinal = data.translations.pt.text;
          else if (data.activeTranslation?.pt) portugueseFinal = data.activeTranslation.pt;

          renderCaptions();
        }
      });
    } catch (e) {
      console.warn("RTDB offline:", e.message);
    }

    // Modal QR
    function openQrModal() {
      const baseUrl = window.location.hostname.includes('web.app') 
        ? 'https://voicy-3fca6.web.app' 
        : `${window.location.protocol}//${window.location.host}`;
      
      const audienceUrl = `${baseUrl}/?session=${sessionId}`;
      const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&margin=8&data=${encodeURIComponent(audienceUrl)}`;

      document.getElementById('qrStageTitle').innerText = sessionId.replace('-', ' ').toUpperCase();
      document.getElementById('qrImage').src = qrApiUrl;
      document.getElementById('qrUrlLabel').innerText = audienceUrl;
      document.getElementById('qrModal').style.display = 'flex';
    }

    function closeQrModal(e) {
      if (!e || e.target.id === 'qrModal' || e.target.tagName === 'BUTTON') {
        document.getElementById('qrModal').style.display = 'none';
      }
    }

    // Exportador de Subtítulos a SRT
    function downloadTranscript(format = 'srt') {
      if (sessionHistory.length === 0) {
        alert("Aún no hay frases transcritas en esta sesión para exportar.");
        return;
      }

      let content = "";
      const baseTime = sessionHistory[0].time.getTime();

      sessionHistory.forEach((item, idx) => {
        const startSec = Math.floor((item.time.getTime() - baseTime) / 1000);
        const endSec = startSec + 4;
        
        function formatSrtTime(s) {
          const hrs = String(Math.floor(s / 3600)).padStart(2, '0');
          const mins = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
          const secs = String(s % 60).padStart(2, '0');
          return `${hrs}:${mins}:${secs},000`;
        }

        const text = item[currentMode] || item.original;
        content += `${idx + 1}\n${formatSrtTime(startSec)} --> ${formatSrtTime(endSec)}\n${text}\n\n`;
      });

      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `nerdearla-${sessionId}-${currentMode}.srt`;
      a.click();
    }
  </script>
</body>
</html>
